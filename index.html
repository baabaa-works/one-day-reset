  {id:'m1',n:1,group:'看清現況',title:'那些被你習慣的微小不滿',question:'有什麼長期不滿，你早已把它當成生活的正常部分？',hint:'從生活、工作、健康、人際關係挑一個最真實的切入點。先描述現象，不急著解決。',placeholder:'我一直以來都在忍受……'},
  {id:'m2',n:2,group:'看清現況',title:'你重複抱怨的三件事',question:'回想過去一年，你反覆向別人或自己抱怨，卻始終沒有改變的三件事是什麼？',hint:'寫下具體事件或情境，避免只寫「很累」「沒時間」等空泛詞彙。',placeholder:'① ……\n② ……\n③ ……'},

  {id:'m5',n:5,group:'建立反願景',title:'五年後：沒有改變的週二',question:'假如接下來五年仍照同樣方式生活，請描寫一個普通星期二。',hint:'描寫早上醒來、身體感受、身邊的人、白天做的事，以及晚上睡前的心情。不要只寫抽象結果。',placeholder:'早上醒來，我在……\n白天我……\n晚上我感覺……'},

  {id:'m7',n:7,group:'建立反願景',title:'回望一生，最可惜的空白',question:'若終其一生都選擇熟悉、保險的路線，你會因為哪些「不曾嘗試」而遺憾？',hint:'不必否定安穩生活，只需要辨認你自己真的在乎的未竟之事。',placeholder:'我一直沒有讓自己去……'},
  {id:'m8',n:8,group:'建立反願景',title:'在現實中看見那條軌跡',question:'你有沒有看過沿著類似模式生活了更久的人？看到他，你對自己的未來有什麼感受？',hint:'可以是認識的人，也可以寫一個觀察到的生活樣貌；不需要評斷對方。',placeholder:'我想到的是……，這讓我感覺……'},
  {id:'m9',n:9,group:'建立反願景',title:'你得放下哪個自我標籤',question:'如果真的要改變，有哪句「我就是這種人」可能必須被重新檢驗？放下它會有什麼社交代價？',hint:'例如「我向來不擅長……」。試著探索這個標籤帶給你的便利與限制。',placeholder:'我常對自己說「我是……的人」；放下它代表……'},
  {id:'m10',n:10,group:'建立反願景',title:'不那麼好聽的拖延理由',question:'若不使用漂亮的藉口，你認為自己至今沒改變的原因可能是什麼？',hint:'不用羞辱自己。害怕、疲倦、資源不足也可能真實存在；盡量把推測與事實分開。',placeholder:'我猜自己可能在害怕……，也有現實限制……'},
  {id:'m11',n:11,group:'建立反願景',title:'迴避行為在保護什麼',question:'如果某種慣性是在保護你不受傷，它替你躲掉了什麼，同時又讓你付出什麼代價？',hint:'例如保護自己不受批評、避免被拒絕或保住熟悉感；不一定只有心理因素。',placeholder:'這個模式可能在保護……，但它也讓我失去……'},
  {id:'m13',n:13,group:'描繪願景',title:'三年後：你想過的普通週二',question:'暫時把可行性放一旁。三年後，你理想中的一個平凡星期二會怎麼過？',hint:'和第 5 題一樣具體：醒來在哪裡、跟誰相處、如何安排工作、身體狀態與晚上的心情。',placeholder:'三年後的早晨……\n白天……\n晚上……'},
  {id:'m14',n:14,group:'描繪願景',title:'替未來的自己定義一個身份',question:'若那種生活對你來說已十分自然，你會如何形容自己的行事原則？',hint:'用「我是會……的人」造句，盡量指向可觀察的行動，而非空泛形容詞。',placeholder:'我是會……的人。'},
  {id:'m15',n:15,group:'描繪願景',title:'這一週，先做哪一步',question:'如果你已經開始用新身份生活，本週你會做的第一個小行動是什麼？',hint:'小到一週之內真的能完成，不需要是一個驚天動地的決定。',placeholder:'本週我願意完成……'}
];
const checkpoints = [
  {id:'d1',time:'11:00',title:'停下手邊的慣性',question:'我正在用現在的行為，迴避哪件更重要的事？'},
  {id:'d2',time:'13:30',title:'回顧過去兩小時',question:'如果只看這兩小時的行動，旁人會以為我想過怎樣的生活？'},
  {id:'d3',time:'15:15',title:'校準你的方向',question:'眼前這些選擇，正在讓我更靠近哪一種未來？'},
  {id:'d4',time:'17:00',title:'找出被忽視的大事',question:'我把什麼明明重要的事，假裝成了不急或不重要？'},
  {id:'d5',time:'19:30',title:'分辨想要與保護',question:'今天哪些行為是為了維持熟悉的自我形象，而非真的想做？'},
  {id:'d6',time:'21:00',title:'找回有感覺的時刻',question:'今天哪些時候最有活力？哪些時候最麻木？'}
];
const bonus = [
  {id:'b1',title:'如果不需要維持別人眼中的那個我，生活會如何不同？'},
  {id:'b2',title:'哪些地方，我正拿活力與可能性換取安全感？'},
  {id:'b3',title:'明天最小、最可行的改變版本是什麼？'}
];
const evening = [
  {id:'e16',n:16,group:'找出核心阻力',title:'今天最深的發現',question:'在今天的觀察後，你對「為什麼一直卡住」有什麼新的理解？',hint:'列出一個最有根據的發現；如果還不確定，也可以記下待驗證的猜想。',placeholder:'我原本以為……，現在我發現可能是……'},
  {id:'e17',n:17,group:'找出核心阻力',title:'幫內在阻力取名字',question:'最常讓你偏離目標的內在信念或習慣模式是什麼？',hint:'不要把問題全部歸因於他人，但也不必否認真實存在的外在限制。',placeholder:'我需要辨認的模式是……'},
  {id:'e18',n:18,group:'萃取方向',title:'一句話：我的反願景',question:'把你不願再走向的未來，濃縮成一句會提醒自己的話。',hint:'它是方向提示，不是用來責罵自己。',placeholder:'我不願再讓人生變成……'},
  {id:'e19',n:19,group:'萃取方向',title:'一句話：我的願景',question:'把你願意投入心力建立的生活，用一句話寫清楚。',hint:'先有可行的初版就好，日後可以隨經驗修改。',placeholder:'我要建立一種能夠……的生活。'},
  {id:'e20',n:20,group:'縮小到行動',title:'一年後，什麼證明你變了',question:'一年後，哪一項具體、看得見的成果，最能說明你已打破舊模式？',hint:'只選一個核心指標，不要同時列下十個互相競爭的目標。',placeholder:'一年後，我希望已經……'},
  {id:'e21',n:21,group:'縮小到行動',title:'接下來一個月的里程碑',question:'未來一個月要完成什麼，才能讓那個一年成果更有可能實現？',hint:'最好是一個可驗收的專案、能力或成果，而不是「更努力」。',placeholder:'未來 30 天，我會完成……'},
  {id:'e22',n:22,group:'縮小到行動',title:'明天的 2–3 個行動任務',question:'明天預留哪些具體時段，做出符合新身份的行動？',hint:'避免寫成「改掉拖延」，試著寫「09:00–09:30 完成第一版草稿」之類可開始的動作。',placeholder:''}
];
const navItems = [
  {id:'overview',n:'◎',title:'旅程總覽',small:'開始這一天'},
  {id:'morning',n:'01',title:'早晨：自我盤點',small:'反願景與願景'},
  {id:'day',n:'02',title:'白天：中斷慣性',small:'六個自我檢查'},
  {id:'evening',n:'03',title:'夜晚：整理方向',small:'把洞察變成行動'},
  {id:'plan',n:'04',title:'人生任務面板',small:'任務與備份'}
];
const el = id=>document.getElementById(id);
const today = ()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const defaults = ()=>({date:today(),view:'overview',mi:0,ei:0,morning:{},evening:{},dayNotes:{},dayDone:{},times:{},bonus:{},constraints:'',quests:[{text:'',time:'09:00',done:false},{text:'',time:'14:00',done:false},{text:'',time:'19:00',done:false}]});
const cleanText = v=>typeof v==='string'?v.slice(0,15000):'';
function normalize(x){
  const d=defaults(); if(!x||typeof x!=='object')return d;
  if(typeof x.date==='string'&&/^\d{4}-\d\d-\d\d$/.test(x.date))d.date=x.date;
  if(navItems.some(v=>v.id===x.view))d.view=x.view;
  d.mi=Number.isInteger(x.mi)?Math.min(morning.length-1,Math.max(0,x.mi)):0;
  d.ei=Number.isInteger(x.ei)?Math.min(evening.length-1,Math.max(0,x.ei)):0;
  for(const k of ['morning','evening','dayNotes','bonus']){
    if(x[k]&&typeof x[k]==='object'){ for(const [a,b] of Object.entries(x[k]))if(/^[a-z]\d+$/.test(a))d[k][a]=cleanText(b); }
  }
  if(x.dayDone&&typeof x.dayDone==='object'){for(const o of checkpoints)d.dayDone[o.id]=x.dayDone[o.id]===true;}
  if(x.times&&typeof x.times==='object'){for(const o of checkpoints)if(/^\d\d:\d\d$/.test(x.times[o.id]||''))d.times[o.id]=x.times[o.id];}
  d.constraints=cleanText(x.constraints);
  if(Array.isArray(x.quests))d.quests=d.quests.map((q,i)=>({text:cleanText(x.quests[i]?.text||''),time:/^\d\d:\d\d$/.test(x.quests[i]?.time||'')?x.quests[i].time:q.time,done:x.quests[i]?.done===true}));
  return d;
}
let state;
try{state=normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch{state=defaults()}
let canStore=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));canStore=true}catch{canStore=false}updateProgress();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isFilled(v){return typeof v==='string'&&v.trim().length>0}
function stats(){
  const m=morning.filter(q=>isFilled(state.morning[q.id])).length;
  const d=checkpoints.filter(q=>state.dayDone[q.id]===true).length;
  const e=evening.slice(0,-1).filter(q=>isFilled(state.evening[q.id])).length;
  const quests=state.quests.filter(q=>isFilled(q.text)).length;
  const action=quests>=2?1:0;
  const c=isFilled(state.constraints)?1:0;
  return {m,d,e,action,c,total:m+d+e+action+c,max:28,percent:Math.round((m+d+e+action+c)/28*100),quests};
}
function updateProgress(){
  const s=stats();
  el('sidePercent').textContent=s.percent+'%';el('sideProgressFill').style.width=s.percent+'%';
  el('sideProgressLabel').textContent=s.total+' / '+s.max+' 個核心節點';
  el('saveStatus').textContent=canStore?'已在本機自動儲存':'此瀏覽器無法儲存，請匯出備份';
  renderNav();
  const counter=el('currentCounter'); if(counter){const cur=state.view==='morning'?s.m:state.view==='day'?s.d:state.view==='evening'?s.e+s.action:s.total;const max=state.view==='morning'?14:state.view==='day'?6:state.view==='evening'?7:28;counter.querySelector('strong').textContent=cur+' / '+max;}
  const idx=el('questionIndex');if(idx&&['morning','evening'].includes(state.view)){const qset=state.view==='morning'?morning:evening;const buttons=idx.querySelectorAll('[data-question-number]');if(buttons.length===qset.length){buttons.forEach(btn=>{const i=Number(btn.dataset.questionNumber),q=qset[i];if(!q)return;const filled=q.id==='e22'?stats().quests>=2:isFilled((state.view==='morning'?state.morning:state.evening)[q.id]);btn.classList.toggle('done',filled)})}}
}
function renderNav(){const s=stats();const badge={morning:`${s.m}/14`,day:`${s.d}/6`,evening:`${s.e+s.action}/7`,plan:`${s.percent}%`};el('nav').innerHTML=navItems.map(v=>`<button type="button" class="nav-button ${v.id===state.view?'active':''}" data-view="${v.id}" aria-current="${v.id===state.view?'page':'false'}"><span class="nav-index">${v.n}</span><span class="nav-text">${esc(v.title)}<small>${esc(badge[v.id]||v.small)}</small></span></button>`).join('')}
function headings(kind){const s=stats();if(kind==='morning')return `<header class="page-heading"><div><p class="eyebrow">PHASE 01 / MORNING · 建議 15–30 分鐘起步</p><h1>先看清自己。<br/>再選擇方向。</h1><p class="lead">你將先寫下正在忍受的現況，描繪不願抵達的未來，最後勾勒真正想過的生活。不知道答案時可以先略過，稍後回來。</p></div><div class="counter" id="currentCounter"><strong>${s.m} / 14</strong><span>題已有回答</span></div></header>`;
if(kind==='day')return `<header class="page-heading"><div><p class="eyebrow">PHASE 02 / DAYTIME · 六次短暫中斷</p><h1>打斷自動駕駛，<br/>觀察真正的選擇。</h1><p class="lead">把提醒排進今天，並在提醒出現時停下來思考 1–3 分鐘。記錄文字可選；每做完一次，勾選「已完成這次觀察」。</p></div><div class="counter" id="currentCounter"><strong>${s.d} / 6</strong><span>次觀察完成</span></div></header>`;
return `<header class="page-heading"><div><p class="eyebrow">PHASE 03 / EVENING · 將洞察轉成方向</p><h1>帶著今天的發現，<br/>寫出明天的行動。</h1><p class="lead">不追求完美的人生宣言。先提煉方向，再從一年、一個月一路縮小到明天的 2–3 個具體動作。</p></div><div class="counter" id="currentCounter"><strong>${s.e+s.action} / 7</strong><span>題已有回答</span></div></header>`;
}
function overview(){const s=stats();return `<section class="hero"><div class="hero-main"><p class="eyebrow" style="color:#577b4a">A PRACTICAL ONE-DAY SELF-REFLECTION</p><h1>停止空想。<br/>重新設計<br/>你的每一天。</h1><p>這不是「一天治好人生」的保證，而是一套有順序的反思與行動練習。從不想要的未來開始，反推出今天可以踏出的第一步。</p><button class="btn btn-dark" type="button" data-view="morning">${s.m?'繼續早晨練習':'開始第一個問題'} <span aria-hidden="true">↗</span></button></div><div class="hero-aside"><div><p class="caption">YOUR CURRENT PROGRESS</p><big>${s.percent}%</big></div><div style="position:relative;z-index:1"><p style="font-size:18px;color:#f3fbe8;font-weight:800">不需要一次寫完。</p><p>寫得真實，比快速通關更重要。每次輸入都會存於此瀏覽器。</p></div></div></section><div class="section-label">THE PROTOCOL / 三個階段</div><div class="overview-grid"><article class="overview-card"><div class="num">01 / MORNING</div><h3>看清現況與未來</h3><p>14 個引導提問，建立反願景、理想願景與新的行動身份。</p><div class="foot"><span>${s.m} / 14 已回答</span><button class="btn btn-quiet btn-sm" data-view="morning">前往 →</button></div></article><article class="overview-card"><div class="num">02 / DAYTIME</div><h3>六次自我檢查</h3><p>依照作者安排的時段，觀察當下行為、迴避、取捨與注意力。</p><div class="foot"><span>${s.d} / 6 已完成</span><button class="btn btn-quiet btn-sm" data-view="day">前往 →</button></div></article><article class="overview-card"><div class="num">03 / EVENING</div><h3>整合洞察與任務</h3><p>7 個收斂題目，建構一年、一個月與明天的可執行計畫。</p><div class="foot"><span>${s.e+s.action} / 7 已回答</span><button class="btn btn-quiet btn-sm" data-view="evening">前往 →</button></div></article></div><div class="info-strip"><strong>如何使用：</strong> 建議用整天分三段完成；你可以跳題、修改答案，也可直接先看任務面板。作者特別強調「問題要自己思考」，因此這個工具不會自動生成你的個人答案。部分題目可能讓人不舒服，可以暫停或略過；它不是心理治療或成功保證。</div><div class="report-tools"><button class="btn btn-outline btn-sm" data-view="plan">查看任務面板 →</button><button class="btn btn-outline btn-sm" data-action="export-json">匯出資料備份</button><a class="btn btn-quiet btn-sm" href="${ORIGINAL_URL}" target="_blank" rel="noopener noreferrer">作者原文 ↗</a></div>`}
function focused(kind){const questions=kind==='morning'?morning:evening;const i=kind==='morning'?state.mi:state.ei;const q=questions[i];const answers=kind==='morning'?state.morning:state.evening;const field=q.id==='e22'?`<div class="quest-editor">${state.quests.map((t,j)=>`<div class="quest-edit-row"><b>${j+1}</b><label class="sr-only" for="quest${j}">明天任務 ${j+1}</label><input id="quest${j}" type="text" data-quest="${j}" maxlength="400" value="${esc(t.text)}" placeholder="${j===2?'第三個任務（選填）':'要做的具體動作'}"/><label class="sr-only" for="questTime${j}">任務 ${j+1} 的開始時間</label><input id="questTime${j}" type="time" data-quest-time="${j}" value="${esc(t.time)}"/></div>`).join('')}</div><p class="quest-footnote">至少寫 2 個行動會計入完成進度。你可以到「人生任務面板」勾選明天的完成狀態。</p>`:`<label class="input-label" for="focusedAnswer"><span>你的真實回答</span><span>可隨時修改，直接自動儲存</span></label><textarea id="focusedAnswer" data-answer="${q.id}" maxlength="15000" placeholder="${esc(q.placeholder)}">${esc(answers[q.id]||'')}</textarea>`;
return `${headings(kind)}<div class="meter" aria-hidden="true">${questions.map((_,j)=>`<span class="${j<=i?'active':''}"></span>`).join('')}</div><div class="workspace"><section class="question-card"><div class="question-meta"><span class="tag ${q.group==='建立反願景'?'tag-warm':''}">${esc(q.group)}</span><span class="qid">QUESTION ${String(i+1).padStart(2,'0')} / ${questions.length} · 原文 #${q.n}</span></div><h2>${esc(q.title)}</h2><p class="prompt">${esc(q.question)}</p><div class="think"><strong>思考提示：</strong> ${esc(q.hint)}</div>${field}<div class="question-footer"><span class="helper-text">${i===questions.length-1?'這是此階段最後一題。':'不確定時，可直接前往下一題。'}</span><div class="question-tools"><button type="button" class="btn btn-outline btn-sm" data-step="-1" ${i===0?'disabled':''}>← 上一題</button><button type="button" class="btn btn-dark btn-sm" data-step="1">${i===questions.length-1?(kind==='morning'?'前往白天階段 →':'前往任務面板 →'):'下一題 →'}</button></div></div></section><aside class="question-index" id="questionIndex"><div class="page-mini">QUICK NAVIGATION</div><p>選擇任何問題；綠色代表已有內容。</p><div class="index-grid">${questions.map((item,j)=>`<button type="button" data-question-number="${j}" class="index-btn ${i===j?'active':''} ${item.id==='e22'?stats().quests>=2?'done':'':isFilled(answers[item.id])?'done':''}" aria-label="前往第 ${item.n} 題" title="${esc(item.title)}">${item.n}</button>`).join('')}</div><div class="aside-note">作者公開版本的早晨題號從 11 直接跳到 13；這裡保留原編號，沒有漏放內容。<br/><br/>你可以按 Ctrl + Enter 前往下一題。</div></aside></div>`;
}
function daytime(){return `${headings('day')}<div class="schedule-toolbar"><span>練習日期</span><label class="sr-only" for="practiceDate">練習日期</label><input id="practiceDate" type="date" data-date value="${esc(state.date)}"/><button type="button" class="btn btn-dark btn-sm" data-action="calendar">↓ 匯出 6 個行事曆提醒 (.ics)</button></div><section class="time-grid">${checkpoints.map((d,i)=>`<article class="time-card ${state.dayDone[d.id]?'done':''}" id="card-${d.id}"><div class="time-card-top"><span class="tag">CHECK-IN ${String(i+1).padStart(2,'0')}</span><label class="sr-only" for="time-${d.id}">提醒 ${i+1} 時間</label><input class="time-input" type="time" id="time-${d.id}" data-time="${d.id}" value="${esc(state.times[d.id]||d.time)}"/></div><h3>${esc(d.title)}</h3><p>${esc(d.question)}</p><label class="sr-only" for="note-${d.id}">這次觀察的筆記</label><textarea id="note-${d.id}" data-note="${d.id}" placeholder="可選填：我注意到……">${esc(state.dayNotes[d.id]||'')}</textarea><label class="checkbox-line"><input type="checkbox" data-done="${d.id}" ${state.dayDone[d.id]?'checked':''} /><span>已完成這次觀察</span></label></article>`).join('')}</section><details class="expand-box"><summary>更多思考題｜通勤、散步時可使用（選填）</summary><div class="bonus-grid">${bonus.map(q=>`<div class="bonus-item"><label for="${q.id}">${esc(q.title)}</label><textarea id="${q.id}" data-bonus="${q.id}" placeholder="把想到的事寫在這裡……">${esc(state.bonus[q.id]||'')}</textarea></div>`).join('')}</div></details><div class="info-strip"><strong>提醒說明：</strong> 時間是原作者建議的例子，可依你的課表或行程自由調整。點「匯出行事曆」會產生含提醒的 .ics 檔，需由你匯入手機或電腦日曆；網頁關閉後不會自行跳出通知。</div><div class="report-tools"><button class="btn btn-outline" data-view="morning">← 回到早晨</button><button class="btn btn-dark" data-view="evening">前往夜晚練習 →</button></div>`}
function vOrEmpty(v){return isFilled(v)?esc(v):'<span class="missing">尚未填寫；先完成對應題目</span>'}
function plan(){const s=stats();const filledQuests=state.quests.filter(q=>isFilled(q.text));return `<div class="page-heading"><div><p class="eyebrow">YOUR LIFE GAME / 由答案生成的行動地圖</p><h1>把人生變成<br/>可行動的遊戲。</h1><p class="lead">依照作者最後的六個元素，把你寫下的「方向」映射成一場可以每天前進的遊戲。下方內容同步來自練習答案，不會替你憑空生成。</p></div><div class="counter"><strong>${s.total} / 28</strong><span>個核心節點</span></div></div><div class="identity-strip"><div class="identity-item"><small>NEW IDENTITY / 第 14 題</small><p>${vOrEmpty(state.morning.m14)}</p></div><div class="identity-item"><small>THE PATTERN / 第 17 題</small><p>${vOrEmpty(state.evening.e17)}</p></div></div><div class="plan-heading"><h2>你的六項遊戲設定</h2><span class="tag">隨時可以重新編輯</span></div><section class="plan-grid"><article class="plan-card"><div class="plan-sub">01 / 反願景 · 失敗代價</div><div class="plan-value">${vOrEmpty(state.evening.e18)}</div><a href="#evening" data-jump="e18">編輯第 18 題 ↗</a></article><article class="plan-card"><div class="plan-sub">02 / 願景 · 勝利方向</div><div class="plan-value">${vOrEmpty(state.evening.e19)}</div><a href="#evening" data-jump="e19">編輯第 19 題 ↗</a></article><article class="plan-card"><div class="plan-sub">03 / 一年目標 · 主線任務</div><div class="plan-value">${vOrEmpty(state.evening.e20)}</div><a href="#evening" data-jump="e20">編輯第 20 題 ↗</a></article><article class="plan-card"><div class="plan-sub">04 / 一個月專案 · 頭目挑戰</div><div class="plan-value">${vOrEmpty(state.evening.e21)}</div><a href="#evening" data-jump="e21">編輯第 21 題 ↗</a></article><article class="plan-card"><div class="plan-sub">05 / 每日槓桿 · 行動任務</div><div class="plan-value">${filledQuests.length?state.quests.filter(q=>isFilled(q.text)).map(q=>`<div style="margin-bottom:6px">${esc(q.time)} · ${esc(q.text)}</div>`).join(''):'<span class="missing">尚未安排明天的行動</span>'}</div><a href="#evening" data-jump="e22">編輯第 22 題 ↗</a></article><article class="plan-card"><div class="plan-sub">06 / 限制條件 · 遊戲規則</div><div class="plan-value">${vOrEmpty(state.constraints)}</div><div style="font-size:12px;color:#809080;margin-top:10px">可於下方直接修改</div></article><div class="constraint-card"><h3>哪些代價是你不願意付出的？</h3><p class="lead" style="font-size:13px">追求改變並不表示要犧牲一切。你希望守住哪些底線、關係或健康條件？這是作者六項設定中的「遊戲規則」。</p><label class="sr-only" for="constraints">你的限制條件</label><textarea id="constraints" data-constraints placeholder="例如：不以長期失眠換取工作進度；每週保留陪伴家人的時間……">${esc(state.constraints)}</textarea></div></section><section class="tomorrow-card"><p class="eyebrow" style="color:#d3edaa">TOMORROW / DAILY QUESTS</p><h2>明天，完成這些就好。</h2><p>勾選的是實際執行進度，不會影響上面的反思完成率。</p><div class="tomorrow-quests">${filledQuests.length?state.quests.map((q,i)=>isFilled(q.text)?`<label class="tomorrow-quest"><input type="checkbox" data-quest-done="${i}" ${q.done?'checked':''}/><strong>${esc(q.time)}</strong><span style="${q.done?'text-decoration:line-through':''}">${esc(q.text)}</span></label>`:'').join(''):'<div class="tomorrow-empty">還沒有明天的任務。回到夜晚第 22 題，先寫下兩個小行動。</div>'}</div></section><div class="report-tools"><button class="btn btn-dark" data-action="export-md">↓ 下載完整反思紀錄 (.md)</button><button class="btn btn-outline" data-action="export-json">↓ 備份資料 (.json)</button><button class="btn btn-outline" data-action="import">↑ 匯入備份</button><button class="btn btn-outline" data-action="print">列印 / 存 PDF</button><button class="btn btn-danger btn-sm danger-last" data-action="reset">清空所有資料</button></div><p class="footer-msg">隱私：所有回答只留在此瀏覽器的本機儲存空間，頁面不會上傳任何答案，也沒有登入與追蹤服務。不同瀏覽器／裝置的資料不會同步；清除網站資料或搬動檔案後可能讀不到原紀錄，建議定期下載 JSON 備份。若本機儲存被禁止，請務必匯出。<br/>方法改編自 <a href="${ORIGINAL_URL}" target="_blank" rel="noopener noreferrer">Dan Koe《How to fix your entire life in 1 day》</a>；中文引導、工具設計與補充提醒為此版本整理。</p>`}
function render(){renderNav();el('topStage').textContent=state.view==='overview'?' / OVERVIEW':' / '+state.view.toUpperCase();const content=el('content');content.innerHTML=state.view==='overview'?overview():state.view==='morning'?focused('morning'):state.view==='day'?daytime():state.view==='evening'?focused('evening'):plan();updateProgress()}
function move(v){if(!navItems.some(x=>x.id===v))return;state.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function step(n){const k=state.view==='morning'?'mi':'ei';const list=state.view==='morning'?morning:evening;const next=state[k]+n;if(next>=list.length){move(state.view==='morning'?'day':'plan');return}if(next<0)return;state[k]=next;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function markdown(){const qtext=(a,id)=>isFilled(a[id])?a[id]:'（未填寫）';const x=['# 一天人生重整紀錄','',`- 練習日期：${state.date}`,'- 改編參考：'+ORIGINAL_URL,'','## 早晨｜現況、反願景與願景',''];for(const q of morning)x.push(`### ${q.n}. ${q.title}`,q.question,'',qtext(state.morning,q.id),'');x.push('## 白天｜六次自我檢查','');for(const q of checkpoints)x.push(`### ${state.times[q.id]||q.time}｜${q.title}`,q.question,`- 完成：${state.dayDone[q.id]?'是':'否'}`,qtext(state.dayNotes,q.id),'');x.push('### 額外思考','');for(const q of bonus)x.push(`- ${q.title}`,qtext(state.bonus,q.id),'');x.push('## 夜晚｜從洞察到行動','');for(const q of evening){x.push(`### ${q.n}. ${q.title}`,q.question,'');if(q.id==='e22'){state.quests.forEach((v,i)=>x.push(`- ${i+1}. [${v.done?'x':' '}] ${v.time} ${v.text||'（未填寫）'}`));x.push('')}else x.push(qtext(state.evening,q.id),'')}
 x.push('## 遊戲規則｜不可犧牲的事','',state.constraints||'（未填寫）','','## 一頁行動地圖','',`- 反願景：${qtext(state.evening,'e18')}`,`- 願景：${qtext(state.evening,'e19')}`,`- 一年使命：${qtext(state.evening,'e20')}`,`- 一個月專案：${qtext(state.evening,'e21')}`,`- 新身份：${qtext(state.morning,'m14')}`,'','> 這是自我反思工具，並非心理治療或成功保證。','');return x.join('\n')}
function printReport(){const x=el('printSheet');let h=`<h1>一天人生重整｜個人反思報告</h1><p class="print-meta">練習日期：${esc(state.date)} · Dan Koe 方法整理 · ${esc(ORIGINAL_URL)}</p>`;for(const [title,qs,answers] of [['早晨：現況、反願景與願景',morning,state.morning],['夜晚：整理洞察與方向',evening.slice(0,-1),state.evening]]){h+=`<h2>${esc(title)}</h2>`;for(const q of qs)h+=`<div class="print-item"><h3>${q.n}. ${esc(q.title)}</h3><p>${esc(answers[q.id]||'（未填寫）')}</p></div>`}h+='<h2>白天：自我檢查</h2>';for(const q of checkpoints)h+=`<div class="print-item"><h3>${esc(state.times[q.id]||q.time)} ${esc(q.title)} ${state.dayDone[q.id]?'✓':''}</h3><p>${esc(state.dayNotes[q.id]||'（未記錄）')}</p></div>`;h+='<h2>明天的任務</h2>';for(const q of state.quests)if(isFilled(q.text))h+=`<p>${q.done?'☑':'☐'} ${esc(q.time)} ${esc(q.text)}</p>`;h+='<h2>不能犧牲的底線</h2><p>'+esc(state.constraints||'（未填寫）')+'</p>';x.innerHTML=h;window.print()}
const icsEscape=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
function calendar(){if(!/^\d{4}-\d\d-\d\d$/.test(state.date)){alert('請先選擇有效的練習日期。');return}const day=state.date.replace(/-/g,'');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const lines=['BEGIN:VCALENDAR','VERSION:2.0','CALSCALE:GREGORIAN','METHOD:PUBLISH','PRODID:-//ONE DAY RESET//SELF REFLECTION//ZH-TW','X-WR-CALNAME:一天人生重整','BEGIN:VTIMEZONE','TZID:Asia/Taipei','X-LIC-LOCATION:Asia/Taipei','BEGIN:STANDARD','TZOFFSETFROM:+0800','TZOFFSETTO:+0800','TZNAME:CST','DTSTART:19700101T000000','END:STANDARD','END:VTIMEZONE'];for(let i=0;i<checkpoints.length;i++){const o=checkpoints[i];const time=state.times[o.id]||o.time;if(!/^\d{2}:\d{2}$/.test(time))continue;const mins=parseInt(time.slice(0,2),10)*60+parseInt(time.slice(3),10);const end=(mins+10)%1440;const endDay=end<mins?new Date(state.date+'T00:00:00').getTime()+86400000:null;const dateEnd=endDay?new Date(endDay).getFullYear().toString()+String(new Date(endDay).getMonth()+1).padStart(2,'0')+String(new Date(endDay).getDate()).padStart(2,'0'):day;const tm=m=>String(Math.floor(m/60)).padStart(2,'0')+String(m%60).padStart(2,'0')+'00';lines.push('BEGIN:VEVENT',`UID:oneday-${day}-${i}@local`,`DTSTAMP:${stamp}`,`DTSTART;TZID=Asia/Taipei:${day}T${tm(mins)}`,`DTEND;TZID=Asia/Taipei:${dateEnd}T${tm(end)}`,`SUMMARY:${icsEscape('人生重整｜'+o.title)}`,`DESCRIPTION:${icsEscape(o.question+'\n做完後回到工作台標記完成。')}`,'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY',`DESCRIPTION:${icsEscape(o.question)}`,'END:VALARM','END:VEVENT')}
lines.push('END:VCALENDAR');download('一天人生重整-提醒-'+state.date+'.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8');}
document.addEventListener('click',e=>{
  const jump=e.target.closest('[data-jump]');if(jump){e.preventDefault();const idx=evening.findIndex(q=>q.id===jump.dataset.jump);if(idx>=0){state.ei=idx;move('evening')}return}
  const view=e.target.closest('[data-view]');if(view){e.preventDefault();move(view.dataset.view);return}
  const index=e.target.closest('[data-question-number]');if(index){const i=Number(index.dataset.questionNumber);if(state.view==='morning')state.mi=i;else if(state.view==='evening')state.ei=i;save();render();return}
  const stepButton=e.target.closest('[data-step]');if(stepButton){step(Number(stepButton.dataset.step));return}
  const act=e.target.closest('[data-action]');if(!act)return;
  switch(act.dataset.action){case'calendar':calendar();break;case'export-json':download('人生重整備份-'+state.date+'.json',JSON.stringify({format:'one-day-reset-tw-v1',...state},null,2),'application/json;charset=utf-8');break;case'export-md':download('人生重整紀錄-'+state.date+'.md',markdown(),'text/markdown;charset=utf-8');break;case'import':el('importFile').click();break;case'print':printReport();break;case'reset':if(confirm('要清空所有回答、白天觀察和任務嗎？此動作無法復原。\n\n建議先下載 JSON 備份。')){state=defaults();save();render();window.scrollTo(0,0)}break;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-answer]')){const k=state.view==='morning'?'morning':'evening';state[k][t.dataset.answer]=t.value;}
  else if(t.matches('[data-note]'))state.dayNotes[t.dataset.note]=t.value;
  else if(t.matches('[data-bonus]'))state.bonus[t.dataset.bonus]=t.value;
  else if(t.matches('[data-constraints]'))state.constraints=t.value;
  else if(t.matches('[data-quest]'))state.quests[Number(t.dataset.quest)].text=t.value;
  else if(t.matches('[data-quest-time]'))state.quests[Number(t.dataset.questTime)].time=t.value;
  else if(t.matches('[data-time]'))state.times[t.dataset.time]=t.value;
  else if(t.matches('[data-date]'))state.date=t.value;
  else return;
  save();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-done]')){state.dayDone[t.dataset.done]=t.checked;save();t.closest('.time-card')?.classList.toggle('done',t.checked);}
  if(t.matches('[data-quest-done]')){state.quests[Number(t.dataset.questDone)].done=t.checked;save();t.closest('.tomorrow-quest')?.querySelector('span')?.style.setProperty('text-decoration',t.checked?'line-through':'none');}
});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'&&['morning','evening'].includes(state.view)){e.preventDefault();step(1)}});
el('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const raw=JSON.parse(await f.text());if(raw.format!=='one-day-reset-tw-v1'&&!('morning'in raw&&'evening'in raw))throw Error('檔案不是本工具的備份格式。');if(!confirm('匯入備份將覆蓋目前這個工作台的內容。確定繼續嗎？'))return;state=normalize(raw);save();render();window.scrollTo(0,0);alert('已成功匯入備份。')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}});
document.addEventListener('reset:workbench',()=>{render();document.getElementById('main').focus({preventScroll:true});});
render();
})();
</script>
